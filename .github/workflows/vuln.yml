name: vuln

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"     # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: go.mod