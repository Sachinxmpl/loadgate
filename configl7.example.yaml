# example configuration file 

mode: l7
listen: "0.0.0.0:8080"

balancer: consistent_hash

timeouts:
  dial: 300ms
  read: 30s
  write: 30s
  idle: 60s
  request: 30s
  response_header: 10s
  drain: 15s

health:
  active:
    interval: 2s
    timeout: 500ms
    rise: 2
    path: /health    # GET must answer 2xx; remove for a TCP-only check
    fall: 3          # failed probes in a row that evict a healthy backend; 0 = probes only readmit
  passive:
    fall: 3
    cooldown: 10s
    fail_on_5xx: false         # false = ignore 5xx for passive fall; true = count them

trusted_proxies: []            # e.g. ["10.0.0.0/8"]; X-Forwarded-For from anyone else is dropped

rate_limit:
  global_rps: 0
  per_client_rps: 0

routes:
  - match:
      path_prefix: "/"
    pool: web

pools:
  web:
    - addr: "127.0.0.1:9001"
      weight: 1
    - addr: "127.0.0.1:9002"
      weight: 1
    - addr : "127.0.0.1:9003"
      weight: 1
